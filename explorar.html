<div class="container">

    <aside class="filters">
      <div class="filter-group">
        <h4 class="filter-title">Rango de precio</h4>

          <div class="price-slider-fill" id="price-slider-fill"></div>
          <input type="range" id="price-min-range" class="price-slider-input" min="0" max="200" step="5" value="0" aria-label="Precio mínimo">

        <div class="price-slider-values">

          <span id="price-max-label">$200+</span>
        </div>
      </div>
      <div class="filter-group">
        <h4 class="filter-title">Categoría</h4>
        <div class="chip-group" id="filter-cat"></div>
      </div>
      <div class="filter-group">
        <h4 class="filter-title">Universidad</h4>
        <div class="chip-group" id="filter-uni"></div>
      </div>
      <div class="filter-group">
        <h4 class="filter-title">Condición</h4>
        <div class="chip-group" id="filter-condition">
          <button type="button" class="chip f-condition" data-value="nuevo">Nuevo</button>
          <button type="button" class="chip f-condition" data-value="como_nuevo">Como nuevo</button>
          <button type="button" class="chip f-condition" data-value="usado_bueno">Buen estado</button>
        </div>
      </div>

    </aside>

    <!-- RESULTS -->

      <div class="results-bar">
        <span class="results-count" id="results-count"></span>

          <option value="featured">Destacados</option>
          <option value="price-asc">Precio: menor a mayor</option>
          <option value="price-desc">Precio: mayor a menor</option>
          <option value="alpha">A–Z</option>
        </select>
      </div>
      <div class="products-grid-3" id="results-grid"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  const normalize = s => s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  let _featuredIds = new Set();
  const PRICE_SLIDER_MAX = 200;

  function getFilters() {
    return {
      cats: [...document.querySelectorAll('.f-cat.active')].map(c => c.dataset.value),
      unis: [...document.querySelectorAll('.f-uni.active')].map(c => c.dataset.value),
      conditions: [...document.querySelectorAll('.f-condition.active')].map(c => c.dataset.value),
      min: Number(document.getElementById('price-min-range').value) || null,
      max: Number(document.getElementById('price-max-range').value) >= PRICE_SLIDER_MAX ? null : Number(document.getElementById('price-max-range').value),
      search: document.getElementById('search-input').value.trim(),
      sort: document.getElementById('sort-select').value,
    };
  }

  async function applyFilters() {
    const f = getFilters();
    const products = await fetchProducts({
      minPrice: f.min, maxPrice: f.max, search: f.search, sort: f.sort, conditions: f.conditions,
    });

    let list = products.map(normalizeProduct).filter(p =>
      (f.cats.length === 0 || f.cats.includes(p.category)) &&
      (f.unis.length === 0 || f.unis.includes(p.university))
    );

    document.getElementById('results-count').textContent = `${list.length} resultados`;
    const grid = document.getElementById('results-grid');
    if (list.length === 0) {
      grid.innerHTML = '<div class="empty-state" style="grid-column: 1/-1;"><div class="icon"><svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></div><h3>Sin resultados</h3><p>Intenta ajustar los filtros</p></div>';
    } else {
      grid.innerHTML = list.map(p => renderProductCard(p, _featuredIds)).join('');
    }
  }

  function toggleChip(chip) {
    chip.classList.toggle('active');
    chip.setAttribute('aria-pressed', chip.classList.contains('active'));
    applyFilters();
  }

  function updatePriceSlider(e) {
    const minEl = document.getElementById('price-min-range');
    const maxEl = document.getElementById('price-max-range');
    let min = Number(minEl.value), max = Number(maxEl.value);
    // Los dos <input type="range"> no se pueden cruzar — si el usuario
    // arrastra uno más allá del otro, empuja al otro en vez de invertirse.
    if (min > max) { if (e && e.target === minEl) maxEl.value = min; else minEl.value = max; }
    min = Number(minEl.value); max = Number(maxEl.value);

    document.getElementById('price-slider-fill').style.left = `${(min / PRICE_SLIDER_MAX) * 100}%`;
    document.getElementById('price-slider-fill').style.right = `${100 - (max / PRICE_SLIDER_MAX) * 100}%`;
    document.getElementById('price-min-label').textContent = `$${min}`;
    document.getElementById('price-max-label').textContent = max >= PRICE_SLIDER_MAX ? `$${PRICE_SLIDER_MAX}+` : `$${max}`;
    applyFilters();
  }

  async function initFilters() {
    const [categories, universities, featuredIds] = await Promise.all([
      fetchCategories(), fetchUniversities(), fetchFeaturedProductIds(),
    ]);
    _featuredIds = featuredIds;

    document.getElementById('filter-cat').innerHTML = categories.map(c =>
      `<button type="button" class="chip f-cat" data-value="${c.name}">${categoryIcon(c.name)} ${c.name}</button>`
    ).join('');
    document.getElementById('filter-uni').innerHTML = universities.map(u =>
      `<button type="button" class="chip f-uni" data-value="${u.short_name}">${u.short_name}</button>`
    ).join('');

    // Preselecciona filtros desde los query params — llegan de la barra
    // de búsqueda del hero (?cat=Libros&uni=ESPE&max=50) o de un enlace
    // directo a una categoría (?cat=Libros).
    const urlParams = new URLSearchParams(window.location.search);
    const initialCat = urlParams.get('cat');
    if (initialCat) {
      const match = categories.find(c => normalize(c.slug).includes(normalize(initialCat)) || normalize(c.name).includes(normalize(initialCat)));
      if (match) {
        const chip = document.querySelector(`.f-cat[data-value="${match.name}"]`);
        if (chip) chip.classList.add('active');
      }
    }
    const initialUni = urlParams.get('uni');
    if (initialUni) {
      const chip = document.querySelector(`.f-uni[data-value="${initialUni}"]`);
      if (chip) chip.classList.add('active');
    }
    const initialMax = parseFloat(urlParams.get('max'));
    if (!isNaN(initialMax)) {
      document.getElementById('price-max-range').value = Math.min(initialMax, PRICE_SLIDER_MAX);
      updatePriceSlider();
    }

    document.querySelectorAll('.f-cat, .f-uni, .f-condition').forEach(el => el.addEventListener('click', () => toggleChip(el)));
    applyFilters();
  }

  document.getElementById('price-min-range').addEventListener('input', updatePriceSlider);
  document.getElementById('price-max-range').addEventListener('input', updatePriceSlider);
  document.getElementById('search-input').addEventListener('input', applyFilters);
  document.getElementById('sort-select').addEventListener('change', applyFilters);
  document.getElementById('clear-filters').addEventListener('click', () => {
    document.querySelectorAll('.f-cat, .f-uni, .f-condition').forEach(c => c.classList.remove('active'));
    document.getElementById('price-min-range').value = 0;
    document.getElementById('price-max-range').value = PRICE_SLIDER_MAX;
    document.getElementById('search-input').value = '';
    updatePriceSlider();
  });

  initFilters();
</script>
</body>

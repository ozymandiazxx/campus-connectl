<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Producto — Campus Connect</title>
<meta name="description" content="Detalle del producto: fotos, precio, vendedor verificado y chat directo para comprar seguro dentro de tu campus.">
<meta property="og:type" content="website">
<meta property="og:site_name" content="Campus Connect">
<meta property="og:title" content="Producto — Campus Connect">
<meta property="og:description" content="Detalle del producto: fotos, precio, vendedor verificado y chat directo para comprar seguro dentro de tu campus.">
<meta property="og:image" content="https://micampusconnect.shop/assets/logo.png">
<meta property="og:url" content="https://micampusconnect.shop/producto.html">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/png" href="assets/logo-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<nav class="nav">
  <div class="nav-inner">
    <a href="index.html" class="logo">
      <img src="assets/logo-icon.svg" class="logo-mark" alt="Campus Connect">
      <span>Campus<span style="color: var(--primary)">Connect</span></span>
    </a>
    <div class="nav-links">
      <a href="index.html">Inicio</a>
      <a href="explorar.html">Explorar</a>
      <a href="vender.html">Vender</a>
      <a href="index.html#como-funciona">¿Cómo funciona?</a>
    </div>
    <div class="nav-actions">
      <a href="cuenta.html" class="btn btn-ghost" id="nav-auth-link">Mi cuenta</a>
      <a href="cuenta.html#mensajes" class="msg-btn" title="Mensajes">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
        <span class="msg-count">0</span>
      </a>
      <a href="carrito.html" class="cart-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="21" r="1"/><circle cx="20" cy="21" r="1"/><path d="M1 1h4l2.68 13.39a2 2 0 002 1.61h9.72a2 2 0 002-1.61L23 6H6"/></svg>
        <span class="cart-count">0</span>
      </a>
      <button class="nav-hamburger" onclick="toggleMobileNav()" aria-label="Abrir menú">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="18" y2="18"/></svg>
      </button>
    </div>
  </div>
  <div class="mobile-nav-panel" id="mobile-nav-panel">
    <a href="index.html">Inicio</a>
    <a href="explorar.html">Explorar</a>
    <a href="vender.html">Vender</a>
    <a href="index.html#como-funciona">¿Cómo funciona?</a>
  </div>
</nav>

<div class="container">
  <div class="breadcrumb" style="padding-top: 2rem;">
    <a href="index.html">Inicio</a> / <a href="explorar.html">Explorar</a> / <span id="bc-cat"></span>
  </div>

  <div class="product-detail" id="detail-root">
    <!-- Filled by JS -->
  </div>

  <section style="margin-top: 3rem; padding-bottom: 4rem;">
    <h2 class="section-title" style="font-size: 1.5rem; margin-bottom: 1.5rem;">Productos <em>relacionados</em></h2>
    <div class="products-grid-3" id="related-grid"></div>
  </section>
</div>

<footer class="footer">
  <div class="container">
    <div class="footer-bottom">
      <span>© 2026 Campus Connect S.A.S.</span>
      <span>Quito · Ecuador</span>
    </div>
  </div>
</footer>

<!-- Visor de fotos a pantalla completa -->
<div class="lightbox" id="lightbox">
  <div class="lightbox-backdrop"></div>
  <button class="lightbox-close" id="lightbox-close" aria-label="Cerrar">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg>
  </button>
  <div class="lightbox-counter" id="lightbox-counter"></div>
  <button class="lightbox-nav lightbox-prev" id="lightbox-prev" aria-label="Anterior">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
  </button>
  <button class="lightbox-nav lightbox-next" id="lightbox-next" aria-label="Siguiente">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>
  </button>
  <div class="lightbox-stage">
    <img id="lightbox-img" src="" alt="Foto ampliada">
  </div>
  <div class="lightbox-filmstrip" id="lightbox-filmstrip"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-client.js"></script>
<script src="app.js"></script>
<script src="cookies.js"></script>
<script src="chat.js"></script>
<script>
  async function openProductChat() {
    const p = window.currentProduct;
    const conversationId = await openOrCreateConversation(p.sellerId, p.id);
    if (conversationId) renderChatModal(conversationId, p.title, p.seller);
  }

  async function init() {
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');
    const raw = id ? await fetchProductById(id) : null;

    if (!raw) {
      document.getElementById('detail-root').innerHTML = `
        <div class="empty-state" style="grid-column: 1/-1;"><div class="icon"><svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></div><h3>Producto no encontrado</h3>
        <a href="explorar.html" class="btn btn-primary" style="margin-top:1.5rem;">Volver a explorar</a></div>`;
      return;
    }

    const product = normalizeProduct(raw);
    window.currentProduct = product;

    const currentUser = await getCurrentUser();
    const isOwner = currentUser && currentUser.id === product.sellerId;
    if (!isOwner) incrementProductViews(product.id);

    document.getElementById('bc-cat').textContent = product.category;
    document.title = `${product.title} — Campus Connect`;

    const images = product.imageUrls.length > 0 ? product.imageUrls : null;

    document.getElementById('detail-root').innerHTML = `
      <div class="product-gallery">
        <div class="gallery-main" id="gallery-main">
          ${images ? `<img src="${images[0]}" alt="${escapeHtml(product.title)}" style="width:100%; height:100%; object-fit:cover; border-radius:inherit;">` : product.icon}
        </div>
        <div class="gallery-thumbs">
          ${images && images.length > 1
            ? images.map((url, i) => `<div class="gallery-thumb" data-img-url="${escapeHtml(url)}"><img src="${url}" alt="${escapeHtml(product.title)} ${i + 1}" style="width:100%; height:100%; object-fit:cover; border-radius:inherit;"></div>`).join('')
            : images
              ? ''
              : `<div class="gallery-thumb">${product.icon}</div><div class="gallery-thumb"><svg width="1.2em" height="1.2em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z"/><path d="m3.3 7 8.7 5 8.7-5"/><path d="M12 22V12"/></svg></div><div class="gallery-thumb"><svg width="1.2em" height="1.2em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg></div><div class="gallery-thumb"><svg width="1.2em" height="1.2em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/></svg></div>`}
        </div>
      </div>
      <div>
        <div class="detail-eyebrow">${escapeHtml(product.category)} · ${escapeHtml(product.university)}</div>
        <h1 class="detail-title">${escapeHtml(product.title)}</h1>
        ${isJobCategory(product.categorySlug) ? `
          <div class="detail-price" style="font-size: 1.4rem;">Oferta de empleo</div>
          <div class="detail-price-meta">No es una compra — se coordina directo con quien publicó · <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg> ${product.views} vistas</div>
        ` : `
          <div class="detail-price">${fmt(product.price)}</div>
          <div class="detail-price-meta">Precio en dólares · +2% de comisión de marketplace al pagar · <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;"><path d="M2.062 12.348a1 1 0 0 1 0-.696 10.75 10.75 0 0 1 19.876 0 1 1 0 0 1 0 .696 10.75 10.75 0 0 1-19.876 0"/><circle cx="12" cy="12" r="3"/></svg> ${product.views} vistas</div>
        `}

        <div class="detail-seller">
          <a href="perfil.html?id=${product.sellerId}" style="display:flex; align-items:center; gap:0.85rem; flex:1; color:inherit; text-decoration:none;">
            <div class="seller-avatar">${avatarInner(product.sellerAvatar)}</div>
            <div>
              <div class="seller-name">${escapeHtml(product.seller)}</div>
              <div class="seller-meta">Vendedor · ${product.university} · <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor" stroke="none" style="vertical-align:-1px;"><path d="M11.525 2.295a.53.53 0 0 1 .95 0l2.31 4.679a2.123 2.123 0 0 0 1.595 1.16l5.166.756a.53.53 0 0 1 .294.904l-3.736 3.638a2.123 2.123 0 0 0-.611 1.878l.882 5.14a.53.53 0 0 1-.771.56l-4.618-2.428a2.122 2.122 0 0 0-1.973 0L6.396 21.01a.53.53 0 0 1-.77-.56l.881-5.139a2.122 2.122 0 0 0-.611-1.879L2.16 9.795a.53.53 0 0 1 .294-.906l5.165-.755a2.122 2.122 0 0 0 1.597-1.16z"/></svg> ${Number(product.sellerRating).toFixed(1)}</div>
            </div>
          </a>
          ${isOwner ? '' : `<button class="btn btn-ghost" style="font-size: 0.85rem; padding: 0.5rem 0.85rem;" onclick="openProductChat()">Mensaje</button>`}
        </div>

        <div class="detail-actions">
          ${isOwner ? `
            <div style="background: var(--bg-deep); border: 1px solid var(--line); border-radius: 10px; padding: 0.85rem; flex: 1; text-align: center; color: var(--text-mute);">
              Este es tu producto
            </div>
            <a href="vender.html?id=${product.id}" class="btn btn-ghost"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.174 6.812a1 1 0 0 0-3.986-3.987L3.842 16.174a2 2 0 0 0-.5.83l-1.321 4.352a.5.5 0 0 0 .623.622l4.353-1.32a2 2 0 0 0 .83-.497z"/><path d="m15 5 4 4"/></svg> Editar</a>
          ` : isJobCategory(product.categorySlug) ? `
            <button class="btn btn-primary" style="flex: 1;" onclick="openProductChat()">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px; margin-right:2px;"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg> Postularme
            </button>
          ` : `
            <button class="btn btn-primary" style="flex: 1;" onclick="addToCart(window.currentProduct)">
              <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px; margin-right:2px;"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg> Añadir al carrito
            </button>
            <button class="btn btn-ghost" onclick="addToCart(window.currentProduct); window.location.href='carrito.html'">
              Comprar ahora
            </button>
          `}
        </div>

        <div class="detail-desc">
          <h3>Descripción</h3>
          <p>${escapeHtml(product.description)}</p>
        </div>

        ${isOwner ? '' : `
          <button class="report-trigger" id="report-trigger-btn" data-product-id="${escapeHtml(product.id)}" data-seller-id="${escapeHtml(product.sellerId)}">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px; margin-right:3px;"><path d="M12 9v4"/><path d="M10.363 3.591 2.257 17.5a1.914 1.914 0 0 0 1.636 2.874h16.214a1.914 1.914 0 0 0 1.636-2.874L13.637 3.591a1.914 1.914 0 0 0-3.274 0Z"/><path d="M12 16h.01"/></svg> Reportar este producto o vendedor
          </button>
        `}
      </div>
    `;

    // Clic en una miniatura cambia la foto principal. Se usa data-img-url +
    // addEventListener en vez de meter la URL dentro de un onclick="..." —
    // ese patrón ya causó un casi-XSS antes (ver sección 11 del manual de
    // desarrollador) porque escapeHtml() no protege comillas simples dentro
    // de un string de JS embebido en un atributo.
    let mainImageIndex = 0;
    document.querySelectorAll('.gallery-thumb[data-img-url]').forEach((thumb, i) => {
      thumb.addEventListener('click', () => {
        document.getElementById('gallery-main').innerHTML =
          `<img src="${thumb.dataset.imgUrl}" alt="Foto ampliada" style="width:100%; height:100%; object-fit:cover; border-radius:inherit;">`;
        mainImageIndex = i;
      });
    });

    // Clic en la imagen principal abre el visor a pantalla completa.
    if (images) {
      const galleryMain = document.getElementById('gallery-main');
      galleryMain.style.cursor = 'zoom-in';
      galleryMain.addEventListener('click', () => openLightbox(images, mainImageIndex));
    }

    const reportBtn = document.getElementById('report-trigger-btn');
    if (reportBtn) {
      reportBtn.addEventListener('click', () => openReportModal({
        productId: reportBtn.dataset.productId,
        userId: reportBtn.dataset.sellerId,
        targetLabel: `Producto: ${product.title}`,
      }));
    }

    const related = await fetchRelatedProducts(product.categoryId, product.id, 3);
    document.getElementById('related-grid').innerHTML = related.map(normalizeProduct).map(p => renderProductCard(p)).join('');
  }

  // ─── Visor de fotos a pantalla completa ───
  let _lbImages = [];
  let _lbIndex = 0;

  function renderLightbox() {
    document.getElementById('lightbox-img').src = _lbImages[_lbIndex];
    const multi = _lbImages.length > 1;
    document.getElementById('lightbox-counter').textContent = multi ? `${_lbIndex + 1} / ${_lbImages.length}` : '';
    document.getElementById('lightbox-counter').style.display = multi ? 'block' : 'none';
    document.getElementById('lightbox-prev').style.display = multi ? 'grid' : 'none';
    document.getElementById('lightbox-next').style.display = multi ? 'grid' : 'none';

    const filmstrip = document.getElementById('lightbox-filmstrip');
    if (!multi) { filmstrip.style.display = 'none'; filmstrip.innerHTML = ''; return; }
    filmstrip.style.display = 'flex';
    filmstrip.innerHTML = _lbImages.map((url, i) =>
      `<img src="${url}" data-i="${i}" class="${i === _lbIndex ? 'active' : ''}">`
    ).join('');
    filmstrip.querySelectorAll('img').forEach(img => {
      img.addEventListener('click', () => { _lbIndex = Number(img.dataset.i); renderLightbox(); });
    });
  }

  function openLightbox(images, startIndex) {
    _lbImages = images;
    _lbIndex = startIndex || 0;
    renderLightbox();
    document.getElementById('lightbox').classList.add('open');
    document.body.style.overflow = 'hidden';
  }

  function closeLightbox() {
    document.getElementById('lightbox').classList.remove('open');
    document.body.style.overflow = '';
  }

  function lightboxNav(delta) {
    _lbIndex = (_lbIndex + delta + _lbImages.length) % _lbImages.length;
    renderLightbox();
  }

  document.getElementById('lightbox-close').addEventListener('click', closeLightbox);
  document.querySelector('.lightbox-backdrop').addEventListener('click', closeLightbox);
  document.getElementById('lightbox-prev').addEventListener('click', () => lightboxNav(-1));
  document.getElementById('lightbox-next').addEventListener('click', () => lightboxNav(1));
  document.addEventListener('keydown', (e) => {
    if (!document.getElementById('lightbox').classList.contains('open')) return;
    if (e.key === 'Escape') closeLightbox();
    else if (e.key === 'ArrowLeft') lightboxNav(-1);
    else if (e.key === 'ArrowRight') lightboxNav(1);
  });

  init();
</script>
</body>
</html>

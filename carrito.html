<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<!-- TODO: reemplaza TU_CLIENT_ID_DE_PAYPAL por el Client ID real (Sandbox mientras pruebas, Live cuando esté listo). El Client ID no es secreto, es seguro tenerlo aquí. -->
<script src="https://www.paypal.com/sdk/js?client-id=AZ39NjYf6ZsVUIaNjeyU8ircuBWZ5a1GRrBQOaCH3mSSP7e3a-6q_GqwGuoW8976Z70pIk0rds5oo_HQ&currency=USD&enable-funding=card"></script>
<script src="supabase-client.js"></script>
<script src="app.js"></script>
<script src="cookies.js"></script>
<script src="chat.js"></script>
<script>
  let _paymentMethod = 'transfer';

  function selectPaymentMethod(method) {
    _paymentMethod = method;
    renderCart();
  }

  function renderCart() {
    const cart = getCart();
    const root = document.getElementById('cart-root');

    if (cart.length === 0) {
      root.innerHTML = `
        <div style="grid-column: 1/-1;">
          <div class="empty-state">
            <div class="icon"><svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg></div>
            <h3>Tu carrito está vacío</h3>
            <p>Explora el marketplace para encontrar productos increíbles.</p>
            <a href="explorar.html" class="btn btn-primary" style="margin-top: 1.5rem;">Explorar productos</a>
          </div>
        </div>
      `;
      return;
    }

    const items = cart.map(p => `
        <div class="cart-item">
          <div class="cart-item-img">${p.imageUrls?.[0] ? `<img src="${p.imageUrls[0]}" style="width:100%; height:100%; object-fit:cover; border-radius:inherit;">` : p.icon}</div>
          <div>
            <div class="cart-item-name">${escapeHtml(p.title)}</div>
            <div class="cart-item-meta">${escapeHtml(p.category)} · ${escapeHtml(p.seller)} · ${escapeHtml(p.university)}</div>
            <button class="remove-btn" data-remove-id="${escapeHtml(p.id)}" style="margin-top: 0.4rem;">Eliminar</button>
          </div>
          <div class="cart-item-actions">
            <div class="qty-control">
              <button data-qty-id="${escapeHtml(p.id)}" data-qty-delta="-1">−</button>
              <span class="qty-value">${p.qty}</span>
              <button data-qty-id="${escapeHtml(p.id)}" data-qty-delta="1">+</button>
            </div>
            <div class="cart-item-price">${fmt(p.price * p.qty)}</div>
          </div>
        </div>
    `).join('');

    const subtotal = cart.reduce((sum, p) => sum + p.price * p.qty, 0);
    const fee = subtotal * 0.02; // 2% comisión marketplace
    const total = subtotal + fee;

    root.innerHTML = `
      <div class="cart-items">${items}</div>
      <aside class="cart-summary">
        <h2 class="summary-title">Resumen del pedido</h2>
        <div class="summary-line">
          <span>Subtotal</span>
          <span class="amount">${fmt(subtotal)}</span>
        </div>
        <div class="summary-line">
          <span>Comisión marketplace (2%)</span>
          <span class="amount">${fmt(fee)}</span>
        </div>
        <div class="summary-line">
          <span>Envío / Entrega</span>
          <span class="amount" style="color: var(--green);">Gratis</span>
        </div>
        <div class="summary-line total">
          <span>Total</span>
          <span class="amount">${fmt(total)}</span>
        </div>

        <div class="pm-tabs" style="display:flex; gap:0.5rem; margin: 1.5rem 0 1rem;">
          <button type="button" class="btn ${_paymentMethod === 'transfer' ? 'btn-primary' : 'btn-ghost'}" style="flex:1; font-size:0.85rem; padding:0.55rem;" onclick="selectPaymentMethod('transfer')">Transferencia</button>
          <button type="button" class="btn ${_paymentMethod === 'paypal' ? 'btn-primary' : 'btn-ghost'}" style="flex:1; font-size:0.85rem; padding:0.55rem;" onclick="selectPaymentMethod('paypal')">PayPal</button>
        </div>

        ${_paymentMethod === 'transfer' ? `
          <div style="margin-bottom: 0.75rem; font-size: 0.9rem; font-weight: 600;">Transfiere el total a esta cuenta</div>
          <div style="background: var(--bg-deep); border: 1px solid var(--line); border-radius: 12px; padding: 1rem; font-size: 0.9rem; line-height: 1.7;">
            <div><strong>Banco:</strong> Produbanco</div>
            <div><strong>Tipo de cuenta:</strong> Cuenta Digital</div>
            <div><strong>Número de cuenta:</strong> 20007993402</div>
            <div><strong>Titular:</strong> Anthony Javier Cevallos</div>
            <div><strong>Cédula/RUC:</strong> 1315167849</div>
          </div>

          <div class="field" style="margin-top: 1rem;">
            <label style="font-size: 0.85rem;">Número de comprobante o referencia *</label>
            <input type="text" id="payment-reference" required placeholder="Ej. últimos 4 dígitos, hora de la transferencia…" style="width:100%; padding:0.6rem; border-radius:8px; border:1px solid var(--line); background:var(--bg-deep); color:var(--text);">
          </div>

          <div class="field" style="margin-top: 0.85rem;">
            <label style="font-size: 0.85rem;">Foto o captura del comprobante *</label>
            <input type="file" id="payment-proof" required accept="image/*" style="width:100%; padding:0.5rem; border-radius:8px; border:1px solid var(--line); background:var(--bg-deep); color:var(--text); font-size: 0.85rem;">
            <div style="font-size: 0.75rem; color: var(--text-dim); margin-top: 0.3rem;">Solo la vemos tú y el vendedor de este pedido — no es pública.</div>
          </div>

          <button class="btn btn-primary btn-block btn-lg" id="transfer-submit-btn" onclick="checkout()" style="margin-top: 1.25rem;">
            Ya transferí ${fmt(total)} →
          </button>
          <p style="font-size: 0.8rem; color: var(--text-dim); text-align: center; margin-top: 0.75rem; display: flex; align-items: center; justify-content: center; gap: 0.35rem;">
            <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;"><rect width="18" height="11" x="3" y="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg> Verificaremos tu pago manualmente y confirmaremos tu pedido en breve
          </p>
        ` : `
          <div id="paypal-button-container" style="margin-top: 0.5rem;"></div>
          <p style="font-size: 0.8rem; color: var(--text-dim); text-align: center; margin-top: 0.75rem;">Pago procesado y verificado por PayPal — tu pedido se confirma al instante.</p>
        `}
      </aside>
    `;

    if (_paymentMethod === 'paypal') renderPaypalButtons(total);
  }

  // Llama a la Edge Function paypal-checkout (nunca se llama a PayPal
  // directo con el secret desde el navegador — eso viviría del lado server).
  async function callPaypalFunction(action, extra) {
    const { data: { session } } = await supabase.auth.getSession();
    if (!session) throw new Error('Debes iniciar sesión.');

    const res = await fetch(`${SUPABASE_URL}/functions/v1/paypal-checkout`, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        Authorization: `Bearer ${session.access_token}`,
        apikey: SUPABASE_KEY,
      },
      body: JSON.stringify({ action, ...extra }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || 'Error al procesar el pago con PayPal.');
    return data;
  }

  function renderPaypalButtons() {
    const container = document.getElementById('paypal-button-container');
    if (!container || typeof paypal === 'undefined') return;
    container.innerHTML = '';

    paypal.Buttons({
      createOrder: async () => {
        const user = await getCurrentUser();
        if (!user) {
          showToast('Inicia sesión para completar tu compra.');
          setTimeout(() => window.location.href = 'cuenta.html', 1200);
          throw new Error('No autenticado');
        }

        const cart = getCart();
        const ownProduct = cart.find(item => item.sellerId === user.id);
        if (ownProduct) {
          showToast(`No puedes comprar tu propio producto: "${ownProduct.title}".`);
          throw new Error('Producto propio');
        }

        // Se crean las órdenes reales primero (precio recalculado server-side,
        // como siempre) — PayPal cobra exactamente ese total, no lo que
        // diga el carrito del navegador.
        const orderIds = [];
        for (const item of cart) {
          const { data, error } = await createOrder({
            productId: item.id,
            quantity: item.qty,
            paymentMethod: 'paypal',
            notes: '',
          });
          if (error) { showToast(`Error al crear el pedido: ${error.message}`); throw new Error(error.message); }
          orderIds.push(data.id);
        }

        window._pendingPaypalOrderIds = orderIds;
        const { paypalOrderId } = await callPaypalFunction('create', { orderIds });
        return paypalOrderId;
      },

      onApprove: async (data) => {
        showToast('Verificando tu pago…');
        try {
          await callPaypalFunction('capture', {
            paypalOrderId: data.orderID,
            orderIds: window._pendingPaypalOrderIds,
          });
          // El aviso al comprador y al vendedor lo manda un trigger en la
          // base de datos (notify_order_paid) apenas payment_status pasa a
          // 'paid' — así funciona igual sin importar si el pago se
          // confirma por acá, por la Edge Function, o por aprobación
          // manual de una transferencia.
          localStorage.removeItem('cc_cart_v2');
          showSuccessModal(
            '¡Pago confirmado!',
            'Tu pedido ya está pagado y el vendedor lo preparará.',
            () => window.location.href = 'index.html'
          );
        } catch (err) {
          showToast('No se pudo confirmar el pago: ' + err.message);
        }
      },

      onError: (err) => {
        console.error('Error de PayPal:', err);
        showToast('Ocurrió un error con PayPal. Intenta de nuevo.');
      },
    }).render('#paypal-button-container');
  }

  async function checkout() {
    const user = await getCurrentUser();
    if (!user) {
      showToast('Inicia sesión para completar tu compra.');
      setTimeout(() => window.location.href = 'cuenta.html', 1200);
      return;
    }

    const cart = getCart();
    if (cart.length === 0) return;

    const ownProduct = cart.find(item => item.sellerId === user.id);
    if (ownProduct) {
      showToast(`No puedes comprar tu propio producto: "${ownProduct.title}". Elimínalo del carrito para continuar.`);
      return;
    }

    const reference = document.getElementById('payment-reference').value.trim();
    const proofFile = document.getElementById('payment-proof').files[0];
    if (!reference) { showToast('Escribe el número de comprobante o referencia.'); return; }
    if (!proofFile) { showToast('Sube una foto o captura del comprobante.'); return; }
    if (proofFile.size > 5 * 1024 * 1024) { showToast('La imagen debe pesar menos de 5 MB.'); return; }

    const submitBtn = document.getElementById('transfer-submit-btn');
    submitBtn.disabled = true;
    showToast('Registrando tu pedido…');

    const orderIds = [];
    for (const item of cart) {
      const { data, error } = await createOrder({
        productId: item.id,
        quantity: item.qty,
        paymentMethod: 'transfer',
        paymentReference: reference,
      });
      if (error) {
        showToast(`Error al crear el pedido: ${error.message}`);
        submitBtn.disabled = false;
        return;
      }
      orderIds.push(data.id);
    }

    showToast('Subiendo comprobante…');
    const { path, error: uploadError } = await uploadPaymentReceipt(orderIds[0], proofFile);
    if (uploadError) {
      showToast(`El pedido se registró, pero el comprobante no se pudo subir: ${uploadError.message}`);
      submitBtn.disabled = false;
      return;
    }
    await attachPaymentProof(orderIds, path);

    setTimeout(() => {
      localStorage.removeItem('cc_cart_v2');
      showSuccessModal(
        'Pedido registrado',
        'Quedó como "pendiente de pago". En cuanto verifiquemos tu transferencia y tu comprobante, confirmaremos el pedido y el vendedor lo preparará.',
        () => window.location.href = 'index.html'
      );
    }, 800);
  }

  // Delegado en el contenedor estable (no en cada botón, que se destruye y
  // se vuelve a crear cada vez que renderCart() reescribe el innerHTML).
  document.getElementById('cart-root').addEventListener('click', (e) => {
    const removeBtn = e.target.closest('[data-remove-id]');
    if (removeBtn) {
      // Solo pregunta si es el último producto — quitarlo deja el carrito
      // vacío. Si quedan más, es una acción de bajo riesgo y no hace
      // falta interrumpir con una confirmación cada vez.
      const isLastItem = getCart().length === 1;
      if (isLastItem && !confirm('Este es el último producto del carrito — ¿quitarlo de todas formas?')) return;
      removeFromCart(removeBtn.dataset.removeId);
      return;
    }

    const qtyBtn = e.target.closest('[data-qty-id]');
    if (qtyBtn) {
      const cart = getCart();
      const item = cart.find(i => i.id === qtyBtn.dataset.qtyId);
      if (item) updateCartQty(qtyBtn.dataset.qtyId, item.qty + Number(qtyBtn.dataset.qtyDelta));
    }
  });

  renderCart();
</script>
</body>

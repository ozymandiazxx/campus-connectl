<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="cookies.js"></script>
<script src="chat.js"></script>
<script>
  function starRow(rating) {
    const full = Math.round(Number(rating) || 0);
    return `<span style="color: var(--gold-light);">${'★'.repeat(full)}${'☆'.repeat(5 - full)}</span>`;
  }

  async function init() {
    const params = new URLSearchParams(window.location.search);
    const id = params.get('id');
    const root = document.getElementById('profile-root');

    const profile = id ? await fetchPublicProfile(id) : null;
    if (!profile) {
      root.innerHTML = `
        <div class="empty-state"><div class="icon"><svg width="1em" height="1em" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0"/></svg></div><h3>Perfil no encontrado</h3>
        <a href="explorar.html" class="btn btn-primary" style="margin-top:1.5rem;">Volver a explorar</a></div>`;
      return;
    }

    document.title = `${profile.first_name} ${profile.last_name} — Campus Connect`;

    const currentUser = await getCurrentUser();
    const isOwnProfile = currentUser && currentUser.id === id;
    const memberSince = new Date(profile.created_at).toLocaleDateString('es-EC', { year: 'numeric', month: 'long' });

    root.innerHTML = `
      <div style="display:flex; align-items:center; gap:1.5rem; flex-wrap:wrap; padding: 2rem 0; border-bottom: 1px solid var(--line); margin-bottom: 2rem;">
        <div class="dash-avatar" style="width:88px; height:88px; font-size:2rem;">${avatarInner(profile.avatar_url)}</div>
        <div style="flex:1; min-width:200px;">
          <h1 style="font-family: var(--font-display); font-size: 1.8rem; margin-bottom: 0.35rem;">${escapeHtml(profile.first_name)} ${escapeHtml(profile.last_name)}</h1>
          <div style="color: var(--text-mute); font-size: 0.95rem; margin-bottom: 0.5rem;">${escapeHtml(profile.universities?.short_name || '')} · Miembro desde ${memberSince}</div>
          <div style="display:flex; align-items:center; gap:0.5rem; font-size: 0.95rem;">
            ${starRow(profile.rating)} <span style="color: var(--text-mute);">${Number(profile.rating ?? 5).toFixed(1)} · ${profile.total_sales ?? 0} ventas · ${profile.total_purchases ?? 0} compras</span>
          </div>
          ${profile.bio ? `<p style="color: var(--text-mute); margin-top: 0.75rem; max-width: 60ch;">${escapeHtml(profile.bio)}</p>` : ''}
        </div>
      </div>
      ${isOwnProfile ? '' : `
        <p style="color: var(--text-mute); font-size: 0.9rem; margin-bottom: 0.5rem;">Para contactar a ${escapeHtml(profile.first_name)}, escríbele desde cualquiera de sus publicaciones abajo.</p>
        <button class="report-trigger" id="report-trigger-btn" style="margin-top:0; margin-bottom: 1.5rem;">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px; margin-right:3px;"><path d="M12 9v4"/><path d="M10.363 3.591 2.257 17.5a1.914 1.914 0 0 0 1.636 2.874h16.214a1.914 1.914 0 0 0 1.636-2.874L13.637 3.591a1.914 1.914 0 0 0-3.274 0Z"/><path d="M12 16h.01"/></svg> Reportar este usuario
        </button>
      `}

      <section style="margin-bottom: 2.5rem;">
        <h2 class="section-title" style="font-size: 1.3rem; margin-bottom: 1.25rem;">Publicaciones <em>activas</em></h2>
        <div class="products-grid-3" id="profile-products"><p style="color: var(--text-mute);">Cargando…</p></div>
      </section>

      <section>
        <h2 class="section-title" style="font-size: 1.3rem; margin-bottom: 1.25rem;">Reseñas</h2>
        <div id="profile-reviews"><p style="color: var(--text-mute);">Cargando…</p></div>
      </section>
    `;

    const reportBtn = document.getElementById('report-trigger-btn');
    if (reportBtn) {
      reportBtn.addEventListener('click', () => openReportModal({
        userId: id,
        targetLabel: `Usuario: ${profile.first_name} ${profile.last_name}`,
      }));
    }

    const [products, reviews] = await Promise.all([
      fetchProducts({ sellerId: id }),
      fetchReviewsForUser(id),
    ]);

    const productsGrid = document.getElementById('profile-products');
    productsGrid.innerHTML = products.length
      ? products.map(normalizeProduct).map(p => renderProductCard(p)).join('')
      : `<p style="color: var(--text-mute);">Sin publicaciones activas por ahora.</p>`;

    const reviewsRoot = document.getElementById('profile-reviews');
    reviewsRoot.innerHTML = reviews.length
      ? reviews.map(r => `
          <div style="background: var(--bg-deep); border: 1px solid var(--line); border-radius: 12px; padding: 1rem; margin-bottom: 0.75rem; display:flex; gap:0.85rem;">
            <div class="dash-avatar" style="width:36px; height:36px; font-size:0.9rem; flex-shrink:0;">${avatarInner(r.reviewer?.avatar_url)}</div>
            <div>
              <div style="display:flex; align-items:center; gap:0.5rem; margin-bottom:0.25rem;">
                <strong>${escapeHtml(r.reviewer ? `${r.reviewer.first_name} ${r.reviewer.last_name}` : 'Usuario')}</strong>
                ${starRow(r.rating)}
                <span style="color: var(--text-dim); font-size: 0.8rem;">${new Date(r.created_at).toLocaleDateString('es-EC')}</span>
              </div>
              ${r.comment ? `<p style="color: var(--text-mute); font-size: 0.9rem;">${escapeHtml(r.comment)}</p>` : ''}
            </div>
          </div>
        `).join('')
      : `<p style="color: var(--text-mute);">Aún no tiene reseñas.</p>`;
  }

  init();
</script>
